<!DOCTYPE html>
<html>
<head>
    <title>Sura Stores</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #f4f4f4; }
        .item { display: inline-block; background: white; padding: 15px; border-radius: 8px; margin-top: 30px; }
        .item img { width: 200px; height: 140px; object-fit: cover; transition: 0.3s; }
        .item:hover img { transform: scale(1.1); }
        .desc { display: none; margin-top: 8px; color: #555; font-size: 0.9em; }
        .item:hover .desc { display: block; }
    </style>
</head>
<body>

    <h1>Sura Stores</h1>
    <div id="container"></div>

    <script src="script.js"></script>
</body>
</html>
