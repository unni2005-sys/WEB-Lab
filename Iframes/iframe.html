<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Practice</title>
</head>
<body>

    <h1>Iframe Practice</h1>

    <!-- Adi Shankara -->
    <h2>Adi Shankara Website</h2>
    <iframe 
        src="https://www.adishankara.ac.in"
        width="600px"
        height="400px"
        title="Adi Shankara Website">
    </iframe>

    <!-- YouTube -->
    <h2>YouTube Video</h2>
    <iframe 
        width="560px"
        height="315px"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube Video"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

    <!-- Own Page -->
    <h2>My Own Web Page</h2>
    <iframe 
        src="Forms.html"
        width="600px"
        height="400px"
        title="My Own Web Page">
    </iframe>

</body>
</html>
