<!DOCTYPE html>
<html lang="en">
<head>
<title>Guess the Colour</title>
<style>
        body
               {
                 font-family: Arial, sans-serif;
                 text-align: center;
                 margin-top: 100px;
                 transition: background-color 0.5s ease;
               }
        input 
	       {
                  padding: 10px;
                  font-size: 16px;
               }

        button 
               {
                  padding: 10px 15px;
                  font-size: 16px;
                  cursor: pointer;
               }
</style>
</head>
<body>

    <h1>Guess the Colour</h1>
    <p>Enter a colour (e.g., red, blue, #ff0000, etc.) and see if you match the random background!</p>
    
    <input type="text" id="colorInput" placeholder="Enter colour name/hex">
    <button id="guessBtn">Submit Guess</button>
    <script src="script.js"></script>
</body>
</html>
