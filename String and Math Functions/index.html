
<!DOCTYPE html>
<html>
<head>
    <title>String and Math Functions</title>
    <script src="functions.js"></script>
</head>
<body>

    <h2>String Functions</h2>

    Enter a String:
    <input type="text" id="str"><br><br>

    Enter Starting Index:
    <input type="number" id="start"><br><br>

    Enter Ending Index:
    <input type="number" id="end"><br><br>

    <button onclick="stringFunctions()">Perform String Operations</button>

    <p id="result"></p>

    <h2>Math Functions</h2>

    Enter Radius:
    <input type="number" id="radius" step="any"><br><br>

    Enter Number for Rounding:
    <input type="number" id="roundNum" step="any"><br><br>

    Enter Number for Absolute Value:
    <input type="number" id="absNum" step="any"><br><br>

    Enter Number for Square Root:
    <input type="number" id="sqrtNum" step="any"><br><br>

    <button onclick="mathFunctions()">Perform Math Operations</button>

    <p id="mathResult"></p>

</body>
</html>
